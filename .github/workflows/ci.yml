name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run tests
      run: |
        python -m pytest || echo "Tests not yet configured"

  test-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        cd web
        if [ -f package-lock.json ]; then
          echo "package-lock.json found, running npm ci"
          npm ci
        else
          echo "package-lock.json not found, generating with npm install --package-lock-only"
          npm install --package-lock-only
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json (generated by CI)" || echo "No changes to commit"
          git push origin HEAD || echo "Push failed"
        fi

    - name: Lint
      run: |
        cd web
        npm run lint || echo "Linting not yet configured"
    
    - name: Build
      run: |
        cd web
        npm run build
